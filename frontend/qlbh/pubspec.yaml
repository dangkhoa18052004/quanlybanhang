# frontend/qlbh/pubspec.yaml
name: qlbh
description: "E-Commerce Flutter App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1
  
  # HTTP & API
  http: ^1.6.0
  dio: ^5.4.0
  
  # Local Storage
  shared_preferences: ^2.2.2
  
  # UI Components
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  
  # Payment
  webview_flutter: ^4.5.0
  url_launcher: ^6.2.3
  
  # Utils
  intl: ^0.19.0
  flutter_rating_bar: ^4.0.1
  image_picker: ^1.0.7
  
  # Loading & Error Handling
  flutter_spinkit: ^5.2.0
  fluttertoast: ^8.2.4
  fl_chart: ^0.66.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
